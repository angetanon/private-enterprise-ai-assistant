# Configuration of the server
server:
  port: 8080

# Configuration of the Spring Boot application
spring:
  application:
    name: private-enterprise-ai-assistant
  datasource:
    url: jdbc:postgresql://localhost:5432/assistant
    username: assistant
    password: assistant
  sql:
      init:
        mode: always
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB


# Configuration of LLM and RAG
app:
  ollama:
    base-url: http://localhost:11434
    model: llama3.2:3b # Specific model to use for inference, e.g., llama3.2:3b, llama3.2:7b, etc.
    temperature: 0.3
    timeout: 5m   # CPU inference is slow
  rag:
    embedding-model: nomic-embed-text # Specific embedding model to use for RAG, e.g., nomic-embed-text, openai-embedding-ada-002, etc.
    chunk-size: 500 # Size of text chunks for indexing and searching (500 to 800)
    chunk-overlap: 50 # Overlap of text chunks for indexing and searching (10% of chunk-size)
    max-results: 3 # Maximum number of results to return for a RAG query
    min-score: 0.5 # Minimum score for a result to be considered relevant (0.0 to 1.0)
    numCtx: 4096 # Number of context tokens for the embedding model (4096 for nomic-embed-text)
  pgvector:
    host: localhost
    port: 5432
    database: assistant
    user: assistant
    password: assistant
  memory:
    cleanup-enabled: true
    retention-days: 30
    cleanup-cron: "0 0 3 * * *"